name: Build Packages

on:
  # push:
  #   branches:
  #     - "24.10"
  #     - "*-dev"
  # pull_request:
  #   branches:
  #     - "24.10"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a72
          - aarch64_cortex-a53

    steps:
      - name: Checkout packages repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Check out only feeds.conf.default from the firmware repo to get pinned
      # feed URLs. This ensures builds use the exact same feed commits as
      # the firmware, guaranteeing binary compatibility.
      - name: Checkout firmware feeds configuration
        uses: actions/checkout@v6
        with:
          repository: OpenMANET/firmware
          ref: "24.10"
          path: firmware
          sparse-checkout: feeds.conf.default
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      # Convert the firmware's feeds.conf.default into the EXTRA_FEEDS format
      # expected by gh-action-sdk (fields joined with | instead of spaces).
      # The openmanet feed is skipped — it is already mounted as the primary
      # feed via FEED_DIR. All other feeds (packages, routing, luci, morse,
      # gateworks, telephony) are included so that:
      #   - Build dependencies (scons/host, python3/host, etc.) are available.
      #   - The OpenMANET/luci fork provides luci.mk for our LuCI packages.
      # Because openmanet is listed FIRST in feeds.conf (gh-action-sdk always
      # prepends it), OpenWRT's first-listed-feed-wins collision rule ensures
      # our packages take precedence when two feeds supply the same package name.
      - name: Parse extra feeds from firmware
        id: parse-feeds
        run: |
          extra_feeds=$(awk \
            '!/^#/ && NF >= 3 && $2 != "openmanet" { printf "%s|%s|%s ", $1, $2, $3 }' \
            firmware/feeds.conf.default)
          echo "extra_feeds=${extra_feeds}" >> "$GITHUB_OUTPUT"

      # Auto-detect all packages to build so the list stays in sync with the
      # repo without manual maintenance. Non-LuCI packages expose PKG_NAME in
      # their Makefile; LuCI packages follow the convention of using the
      # directory name as the package name (set implicitly by luci.mk).
      - name: Detect packages
        id: detect-packages
        run: |
          pkgs=$(grep -rh "^PKG_NAME:=" --include="Makefile" \
            boards/ drivers/ lang/ lib/ multimedia/ net/ openmanetd/ routing/ utils/ \
            2>/dev/null | sed 's/PKG_NAME:=//' | tr '\n' ' ')

          luci_pkgs=$(find luci/ -mindepth 1 -maxdepth 1 -type d \
            -exec basename {} \; 2>/dev/null | tr '\n' ' ')

          packages="${pkgs}${luci_pkgs}"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

      - name: Build packages with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-24.10.2
          FEEDNAME: openmanet
          # Prevent the SDK's built-in feeds.conf.default from being used.
          # We supply the complete feed list ourselves via EXTRA_FEEDS so that
          # feed commits exactly match what the firmware build uses.
          NO_DEFAULT_FEEDS: "1"
          EXTRA_FEEDS: ${{ steps.parse-feeds.outputs.extra_feeds }}
          PACKAGES: ${{ steps.detect-packages.outputs.packages }}
          # Generate a Packages.gz index so the output directory can be used
          # directly as an opkg package feed.
          INDEX: "1"
          BUILD_LOG: "1"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packages-${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/openmanet/
          if-no-files-found: warn

      - name: Upload build logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore

