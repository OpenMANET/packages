# openmanetd requests a 1 MiB SO_RCVBUF per RTP receive socket; the kernel
# silently clamps requests at net.core.rmem_max (212992 by default). 2 MiB
# lets the full request apply with headroom. Boards may override with a
# higher-numbered /etc/sysctl.d/25-*.conf.
net.core.rmem_max=2097152
net.core.wmem_max=2097152
