logLevel: info
meshNetInterface: br-ahwlan
dbFile: /etc/openmanetd/openmanetd.db
gnss:
  enable: true
  sendAsExternalGNSSSource:
    sendAsNMEA: true
    sendAsCoT: true
alfred:
  mode: primary
  batInterface: bat0
  socketPath: /var/run/alfred.sock
  dataTypes:
    gateway: true
    node: true
    position: true
    addressReservation: true
ptt:
  enable: false
  mcastPort: 5007
  debug: true
  loopback: false
  protocol: rtp
  controlSource: cm108
