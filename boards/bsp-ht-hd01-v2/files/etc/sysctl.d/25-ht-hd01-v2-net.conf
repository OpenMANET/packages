# Board override of 20-openmanetd-net.conf (later lexical order wins).
# HT-HD01 V2 (MT7628AN) is RAM-constrained: cap at exactly openmanetd's
# 1 MiB request. The clamp applies before the kernel doubles the granted
# value, so the daemon still gets its full request; only other apps are
# limited.
net.core.rmem_max=1048576
net.core.wmem_max=1048576
