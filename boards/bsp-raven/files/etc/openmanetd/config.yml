logLevel: info
gnss:
  enable: true
  sendAsExternalGNSSSource:
    sendAsNMEA: true
    sendAsCoT: true
# Beyond Line of Sight (BLOS) communication settings
# This is only available for use on Mesh Gateways and
# hardware that supports it.
blos:
  enable: false
# Voice Comms
# This is only available on hardware that supports it.
comms:
  enable: true
  debug: false
  # The control source for the Push-to-Talk (PTT) functionality. Options include:
  # - openvlm: Use a Open Voice Link Module USB audio device for PTT control.
  # - nanoPTT: Use a NanoPTT device for PTT control.
  # - web: Use a web-based interface for PTT control.
  controlSource: openvlm
  # Hardware talk group selector. Raven wires a 6-position rotary switch
  # to GPIO17/27/22/24/10 (TALKGROUP_1..5 in the device tree overlay,
  # pull-up, active-low; position 6 leaves all five lines high). The line
  # assignment lives in openmanetd; this only enables the watcher.
  gpioSelector:
    enable: true
setup:
    enabled: true
    complete: false
# Authentication settings for the OpenMANET daemon. If authentication is enabled, users will need to provide valid credentials to access the daemon's features and services.
# Auth is disabled by default for the setup wizard to work.  Once setup is complete auth is enabled by default.
auth:
    enable: false
