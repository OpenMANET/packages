[aiscot]
# Receive NMEA AIS sentences from an external receiver on this UDP socket.
LISTEN_HOST = 127.0.0.1
LISTEN_PORT = 10110
# Send-only CoT output avoids claiming the shared TAK receive port.
# Change to the desired TAK destination before enabling the service.
COT_URL = udp+wo://239.2.3.1:6969
SENSOR_BEACON = 0
